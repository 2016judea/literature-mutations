<style>
:root{--bg:#f7f3ec;--bg2:#efe9dd;--ink:#1c1814;--ink2:#544e44;--faint:#8b8478;
  --rule:rgba(60,50,40,.16);--accent:#3a5a7c}
@media(prefers-color-scheme:dark){:root{--bg:#15120f;--bg2:#1d1916;--ink:#e9e3d5;
  --ink2:#b3aa9a;--faint:#7d766a;--rule:rgba(230,220,200,.16);--accent:#7ea6c9}}
body{background:var(--bg);color:var(--ink);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;line-height:1.5;
  max-width:760px;margin:0 auto;padding:32px 20px 60px}
h1{font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);font-weight:500}
.fig{margin:26px 0 6px}
.fig svg{width:100%;height:auto;display:block;background:var(--bg2);
  border:1px solid var(--rule);border-radius:7px}
.fig .ed{stroke:var(--faint);stroke-width:1.2;fill:none;opacity:.5}
.fig .ax{stroke:var(--faint);stroke-width:1.3;fill:none}
.fig .nd{fill:var(--ink2)}
.fig .ln{stroke:var(--ink2);stroke-width:2.2;fill:none}
.fig .ac{fill:var(--accent)}
.fig .acs{stroke:var(--accent);stroke-width:2;fill:none}
.fig .acd{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 5;fill:none}
.fig .band{fill:var(--accent);opacity:.10}
.fig text{fill:var(--faint)}
.fig .lbl{fill:var(--ink2)}
.fig-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.fig-scroll svg{min-width:600px}
.figcap{margin:11px 0 4px;font-size:11.5px;color:var(--faint);text-align:center;
  letter-spacing:.02em;line-height:1.55}
.figcap b{color:var(--ink2);font-weight:500}.figcap .n{color:var(--accent)}
</style>

      <figcaption class="figcap"><b>Fig. 8 — A genre name entering the trade.</b> The phrase <span class="n">“mystery story”</span> appears <span class="n">zero times</span> in 41.8M words of the American book trade across 1,690 issues, 1855–1895 — then 1,605 times in the 34 years that follow. First use <span class="n">1896</span>, sustained from 1896, take-off <span class="n">1906-1909</span>, plateau to the 1929 ceiling. It is not one repeated house ad and not authors’ titles: the hits sit in the trade’s own descriptive line, where <i>“a mystery story for girls”</i> is a shelf label rather than a review. <span class="n">“Detective story”</span> is drawn behind it as context, not as a peer series — it is already present when the readable window opens (1862), sustained from 1873, and still rising at 1929.</figcaption>

      <figcaption class="figcap"><b>Fig. 9 — Why take-offs ship as bands.</b> A fraction-of-peak take-off computed on a <i>smoothed sparse</i> series can precede the term’s first actual occurrence, because a moving average spreads a first spike backwards. It did: <span class="n">sensation novel</span> first appears in 1863 and the estimator reported <span class="n">1859</span> — which happens to match the Google Books date exactly, and would have been read as a replication. Re-run across smoothing widths 9/5/3/1, <span class="n">sea story</span>’s take-off moves <span class="n">74 years</span>. So every take-off here is a band, a band wider than 10 years is reported as not measurable, and <span class="n">5 of 11</span> terms survive the rule.</figcaption>
