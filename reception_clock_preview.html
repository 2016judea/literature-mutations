.fig text{font-family:ui-monospace,monospace;fill:var(--faint)}

.fig-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}

.figcap{margin:11px 0 4px;font-family:ui-monospace,monospace;font-size:11.5px;

      <figcaption class="figcap"><b>Fig. 6 — Two clocks on the same genres.</b> Thin rules are each community’s books in time; <span class="n">accent</span> is when its genre <i>name</i> entered English, measured from Google Books with no dependence on the text pipeline. Only <span class="n">detective fiction</span> has a datable name take-off that lands inside its own textual span (<span class="n">1889</span> against books of 1878–1926), and the name peaks in <span class="n">1932</span> — the golden age. The rest were already in use before the readable window opens, which is what a perennial mode looks like from the reception side. Rows are titled by each cluster’s own vocabulary, not by its held-out label: three of the eight labels disagree with the cluster they name (see Fig. 7). The control row is era-neutral phrasing about fiction (“the novel”, “a novel”), and its naming mass is <span class="n">67y</span> wide — as spread as the widest genre here and 2.9× wider than detective’s 23y. Corpus composition does not manufacture narrow naming mass, so the narrow rows are signal and not an artifact of Google Books growing.</figcaption>

      <figcaption class="figcap"><b>Fig. 7 — The cost of trusting the label.</b> Three of the eight held-out Gutenberg labels name a genre their own cluster is not: the cluster labelled “Science fiction” has the vocabulary <i>castle, veil, trembled</i>, and the one labelled “Fantasy fiction” has <i>archbishop, cardinal, priest</i>. Dating those clusters by their label instead of their vocabulary moves the answer <span class="n">+142 years</span> in the worst case (Gothic / sensation fiction) and invents a twentieth-century emergence for a mode that was already named before 1800. The labels validate <i>that</i> a cluster is recognised; they do not license dating it.</figcaption>
